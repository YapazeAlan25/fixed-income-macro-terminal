<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5578"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="url(#bgGrad)"/>

  <text x="600" y="45" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="700">Arquitectura del sistema</text>
  <text x="600" y="72" text-anchor="middle" fill="#8b95b3" font-size="14">De la fuente oficial al gráfico interactivo — 5 capas independientes</text>

  <!-- Layer 1: Fuentes -->
  <text x="60" y="118" fill="#8b95b3" font-size="13" font-weight="600" letter-spacing="1">01 · FUENTES DE DATOS</text>
  <g font-size="13" fill="#cbd5f5">
    <rect x="60" y="130" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="124" y="152" text-anchor="middle">BCRA</text>
    <text x="124" y="168" text-anchor="middle" font-size="11" fill="#8b95b3">series · informes</text>
    <rect x="196" y="130" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="260" y="152" text-anchor="middle">INDEC</text>
    <text x="260" y="168" text-anchor="middle" font-size="11" fill="#8b95b3">Excel · calendario</text>
    <rect x="332" y="130" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="396" y="152" text-anchor="middle">FRED · ECB · BIS</text>
    <text x="396" y="168" text-anchor="middle" font-size="11" fill="#8b95b3">Tesoro EE.UU.</text>
    <rect x="468" y="130" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="532" y="152" text-anchor="middle">datos.gob.ar</text>
    <text x="532" y="168" text-anchor="middle" font-size="11" fill="#8b95b3">ARCA · Finanzas</text>
    <rect x="604" y="130" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="668" y="152" text-anchor="middle">FMI</text>
    <text x="668" y="168" text-anchor="middle" font-size="11" fill="#8b95b3">API de datos (SDMX)</text>
    <rect x="740" y="130" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="804" y="152" text-anchor="middle">MAE</text>
    <text x="804" y="168" text-anchor="middle" font-size="11" fill="#8b95b3">prospectos legales</text>
    <rect x="876" y="130" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="940" y="152" text-anchor="middle">IOL · Rava</text>
    <text x="940" y="168" text-anchor="middle" font-size="11" fill="#8b95b3">precios y futuros</text>
    <rect x="1012" y="130" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="1076" y="152" text-anchor="middle">Yahoo · CNV</text>
    <text x="1076" y="168" text-anchor="middle" font-size="11" fill="#8b95b3">mercados · ratings</text>
  </g>

  <line x1="600" y1="176" x2="600" y2="212" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Ingesta -->
  <rect x="160" y="218" width="880" height="56" rx="10" fill="#131a2e" stroke="#3a4570" stroke-width="1.5"/>
  <text x="600" y="242" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">02 · MOTOR DE INGESTA</text>
  <text x="600" y="262" text-anchor="middle" fill="#9aa4c4" font-size="12">13 fuentes en paralelo · valida estructura, historia y frescura · incremental · no pisa un archivo bueno con uno incompleto</text>

  <line x1="600" y1="274" x2="600" y2="310" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Warehouse -->
  <rect x="380" y="316" width="440" height="60" rx="10" fill="#161d33" stroke="#48bb78" stroke-width="1.5"/>
  <text x="600" y="342" text-anchor="middle" fill="#68d391" font-size="15" font-weight="700">03 · DATA WAREHOUSE</text>
  <text x="600" y="363" text-anchor="middle" fill="#9aa4c4" font-size="12">DuckDB (analítico, embebido) + Parquet · respaldo verificado</text>

  <line x1="500" y1="376" x2="440" y2="418" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="376" x2="760" y2="418" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: dos ramas -->
  <text x="220" y="410" fill="#8b95b3" font-size="13" font-weight="600" letter-spacing="1">04 · CAPA DE ANÁLISIS</text>

  <!-- Rama pricing -->
  <rect x="120" y="418" width="440" height="188" rx="10" fill="#171422" stroke="#9f7aea" stroke-width="1.5"/>
  <text x="340" y="444" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">Motores de Pricing</text>
  <text x="340" y="461" text-anchor="middle" fill="#8b95b3" font-size="11">orquestados con Prefect · NumPy / SciPy / Numba (JIT)</text>

  <g font-size="12" fill="#cbd5f5">
    <rect x="140" y="474" width="190" height="30" rx="6" fill="#211b33"/>
    <text x="235" y="494" text-anchor="middle">Tasa Fija</text>
    <rect x="340" y="474" width="200" height="30" rx="6" fill="#211b33"/>
    <text x="440" y="494" text-anchor="middle">CER (lookup T-10 + proyección REM)</text>

    <rect x="140" y="510" width="190" height="30" rx="6" fill="#211b33"/>
    <text x="235" y="530" text-anchor="middle">Dollar Linked</text>
    <rect x="340" y="510" width="200" height="30" rx="6" fill="#211b33"/>
    <text x="440" y="530" text-anchor="middle">Duales (ruteo por pata)</text>

    <rect x="140" y="546" width="400" height="30" rx="6" fill="#211b33"/>
    <text x="340" y="566" text-anchor="middle">Hard Dollar — Soberanos / Provinciales / ONs (Local + NY)</text>
  </g>
  <text x="340" y="596" text-anchor="middle" fill="#8b95b3" font-size="11">TIR · Duration · Convexidad · Z-spread · vistas Mercado / Compra / Venta</text>

  <!-- Rama señales -->
  <rect x="640" y="418" width="440" height="188" rx="10" fill="#131f22" stroke="#4299e1" stroke-width="1.5"/>
  <text x="860" y="444" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">Capa de Señales &amp; Análisis</text>
  <text x="860" y="461" text-anchor="middle" fill="#8b95b3" font-size="11">sin look-ahead bias · corrección por pruebas múltiples</text>

  <g font-size="12" fill="#cbd5f5">
    <rect x="660" y="474" width="190" height="30" rx="6" fill="#122733"/>
    <text x="755" y="494" text-anchor="middle">GSSI (estrés global)</text>
    <rect x="860" y="474" width="200" height="30" rx="6" fill="#122733"/>
    <text x="960" y="494" text-anchor="middle">Nowcasting recesión EE.UU.</text>

    <rect x="660" y="510" width="190" height="30" rx="6" fill="#122733"/>
    <text x="755" y="530" text-anchor="middle">Valor relativo · TIR histórica</text>
    <rect x="860" y="510" width="200" height="30" rx="6" fill="#122733"/>
    <text x="960" y="530" text-anchor="middle">Carry · forwards · roll-down</text>

    <rect x="660" y="546" width="400" height="30" rx="6" fill="#122733"/>
    <text x="860" y="566" text-anchor="middle">14 vistas macro Argentina (fiscal · bancos · reservas ...)</text>
  </g>
  <text x="860" y="596" text-anchor="middle" fill="#8b95b3" font-size="11">banderas 🟢🟡🔴 · frescura de datos por serie</text>

  <line x1="340" y1="606" x2="500" y2="646" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="606" x2="700" y2="646" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5: Dashboard -->
  <rect x="160" y="652" width="880" height="150" rx="12" fill="#161d33" stroke="#ed8936" stroke-width="1.5"/>
  <text x="600" y="682" text-anchor="middle" fill="#fbb768" font-size="16" font-weight="700">05 · DASHBOARD (Streamlit + Plotly)</text>

  <g font-size="12.5" fill="#cbd5f5">
    <rect x="180" y="698" width="160" height="76" rx="8" fill="#241a10"/>
    <text x="260" y="724" text-anchor="middle" font-weight="600">Inicio</text>
    <text x="260" y="742" text-anchor="middle" font-size="10.5" fill="#9aa4c4">brief matutino</text>
    <text x="260" y="758" text-anchor="middle" font-size="10.5" fill="#9aa4c4">reloj y banderas</text>
    <rect x="350" y="698" width="160" height="76" rx="8" fill="#241a10"/>
    <text x="430" y="724" text-anchor="middle" font-weight="600">Renta Fija</text>
    <text x="430" y="742" text-anchor="middle" font-size="10.5" fill="#9aa4c4">16 pestañas</text>
    <text x="430" y="758" text-anchor="middle" font-size="10.5" fill="#9aa4c4">200+ instrumentos</text>
    <rect x="520" y="698" width="160" height="76" rx="8" fill="#241a10"/>
    <text x="600" y="724" text-anchor="middle" font-weight="600">Liquidez Global</text>
    <text x="600" y="742" text-anchor="middle" font-size="10.5" fill="#9aa4c4">Charting · niveles</text>
    <text x="600" y="758" text-anchor="middle" font-size="10.5" fill="#9aa4c4">GSSI · recesión US</text>
    <rect x="690" y="698" width="160" height="76" rx="8" fill="#241a10"/>
    <text x="770" y="724" text-anchor="middle" font-weight="600">Macro Argentina</text>
    <text x="770" y="742" text-anchor="middle" font-size="10.5" fill="#9aa4c4">14 vistas</text>
    <text x="770" y="758" text-anchor="middle" font-size="10.5" fill="#9aa4c4">fiscal · bancos · reservas</text>
    <rect x="860" y="698" width="160" height="76" rx="8" fill="#241a10"/>
    <text x="940" y="724" text-anchor="middle" font-weight="600">Mi cartera</text>
    <text x="940" y="742" text-anchor="middle" font-size="10.5" fill="#9aa4c4">tenencias · riesgo</text>
    <text x="940" y="758" text-anchor="middle" font-size="10.5" fill="#9aa4c4">calificaciones CNV</text>
  </g>

  <text x="600" y="852" text-anchor="middle" fill="#5b6488" font-size="11.5">Dos repos privados — motor de datos + motor de análisis — comparten un mismo warehouse. Este repo documenta el resultado.</text>
</svg>
