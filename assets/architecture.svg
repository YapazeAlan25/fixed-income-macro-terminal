<svg viewBox="0 0 1200 1120" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5578"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="1120" fill="url(#bgGrad)"/>

  <text x="600" y="45" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="700">Arquitectura del sistema</text>
  <text x="600" y="72" text-anchor="middle" fill="#8b95b3" font-size="14">De la fuente oficial al informe del analista — datos, pricing, análisis y entrega, todo automatizado</text>

  <!-- KPIs -->
  <g>
    <rect x="60" y="92" width="200" height="50" rx="10" fill="#131a2e" stroke="#2d3657"/>
    <text x="160" y="115" text-anchor="middle" fill="#fbb768" font-size="19" font-weight="700">13</text>
    <text x="160" y="132" text-anchor="middle" fill="#9aa4c4" font-size="11">fuentes en paralelo</text>
    <rect x="280" y="92" width="200" height="50" rx="10" fill="#131a2e" stroke="#2d3657"/>
    <text x="380" y="115" text-anchor="middle" fill="#fbb768" font-size="19" font-weight="700">200+</text>
    <text x="380" y="132" text-anchor="middle" fill="#9aa4c4" font-size="11">instrumentos de renta fija</text>
    <rect x="500" y="92" width="200" height="50" rx="10" fill="#131a2e" stroke="#2d3657"/>
    <text x="600" y="115" text-anchor="middle" fill="#fbb768" font-size="19" font-weight="700">7 × 3</text>
    <text x="600" y="132" text-anchor="middle" fill="#9aa4c4" font-size="11">motores × vistas de precio</text>
    <rect x="720" y="92" width="200" height="50" rx="10" fill="#131a2e" stroke="#2d3657"/>
    <text x="820" y="115" text-anchor="middle" fill="#fbb768" font-size="19" font-weight="700">~2.000</text>
    <text x="820" y="132" text-anchor="middle" fill="#9aa4c4" font-size="11">tests automatizados</text>
    <rect x="940" y="92" width="200" height="50" rx="10" fill="#131a2e" stroke="#2d3657"/>
    <text x="1040" y="115" text-anchor="middle" fill="#fbb768" font-size="19" font-weight="700">14</text>
    <text x="1040" y="132" text-anchor="middle" fill="#9aa4c4" font-size="11">vistas macro Argentina</text>
  </g>

  <!-- Layer 1: Fuentes -->
  <text x="60" y="172" fill="#8b95b3" font-size="13" font-weight="600" letter-spacing="1">01 · FUENTES DE DATOS</text>
  <text x="60" y="190" fill="#68d391" font-size="10.5" letter-spacing="1">OFICIALES</text>
  <text x="740" y="190" fill="#fbb768" font-size="10.5" letter-spacing="1">MERCADO Y DOCUMENTOS</text>
  <g font-size="13" fill="#cbd5f5">
    <rect x="60" y="198" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="124" y="220" text-anchor="middle">BCRA</text>
    <text x="124" y="236" text-anchor="middle" font-size="11" fill="#8b95b3">series · informes</text>
    <rect x="196" y="198" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="260" y="220" text-anchor="middle">INDEC</text>
    <text x="260" y="236" text-anchor="middle" font-size="11" fill="#8b95b3">Excel · calendario</text>
    <rect x="332" y="198" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="396" y="220" text-anchor="middle">FRED · ECB · BIS</text>
    <text x="396" y="236" text-anchor="middle" font-size="11" fill="#8b95b3">Tesoro EE.UU.</text>
    <rect x="468" y="198" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="532" y="220" text-anchor="middle">datos.gob.ar</text>
    <text x="532" y="236" text-anchor="middle" font-size="11" fill="#8b95b3">ARCA · Finanzas</text>
    <rect x="604" y="198" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="668" y="220" text-anchor="middle">FMI</text>
    <text x="668" y="236" text-anchor="middle" font-size="11" fill="#8b95b3">API de datos (SDMX)</text>
    <rect x="740" y="198" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="804" y="220" text-anchor="middle">MAE</text>
    <text x="804" y="236" text-anchor="middle" font-size="11" fill="#8b95b3">prospectos legales</text>
    <rect x="876" y="198" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="940" y="220" text-anchor="middle">IOL</text>
    <text x="940" y="236" text-anchor="middle" font-size="11" fill="#8b95b3">y fuentes públicas</text>
    <rect x="1012" y="198" width="128" height="46" rx="8" fill="#161d33" stroke="#2d3657"/>
    <text x="1076" y="220" text-anchor="middle">Yahoo · CNV</text>
    <text x="1076" y="236" text-anchor="middle" font-size="11" fill="#8b95b3">mercados · ratings</text>
  </g>

  <line x1="600" y1="244" x2="600" y2="280" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Ingesta -->
  <rect x="160" y="286" width="880" height="62" rx="10" fill="#131a2e" stroke="#3a4570" stroke-width="1.5"/>
  <text x="600" y="311" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">02 · MOTOR DE INGESTA</text>
  <text x="600" y="332" text-anchor="middle" fill="#9aa4c4" font-size="12">13 fuentes en paralelo · valida estructura, historia y frescura · incremental · no pisa un archivo bueno con uno incompleto</text>

  <line x1="600" y1="348" x2="600" y2="382" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Warehouse -->
  <rect x="380" y="388" width="440" height="62" rx="10" fill="#161d33" stroke="#48bb78" stroke-width="1.5"/>
  <text x="600" y="414" text-anchor="middle" fill="#68d391" font-size="15" font-weight="700">03 · DATA WAREHOUSE</text>
  <text x="600" y="435" text-anchor="middle" fill="#9aa4c4" font-size="12">DuckDB (analítico, embebido) + Parquet · respaldo verificado</text>

  <line x1="500" y1="450" x2="440" y2="492" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="450" x2="760" y2="492" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: dos ramas -->
  <text x="120" y="484" fill="#8b95b3" font-size="13" font-weight="600" letter-spacing="1">04 · CAPA DE ANÁLISIS</text>

  <rect x="120" y="494" width="440" height="190" rx="10" fill="#171422" stroke="#9f7aea" stroke-width="1.5"/>
  <text x="340" y="520" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">Motores de Pricing</text>
  <text x="340" y="537" text-anchor="middle" fill="#8b95b3" font-size="11">orquestados con Prefect · NumPy / SciPy / Numba (JIT)</text>
  <g font-size="12" fill="#cbd5f5">
    <rect x="140" y="550" width="190" height="30" rx="6" fill="#211b33"/>
    <text x="235" y="570" text-anchor="middle">Tasa Fija</text>
    <rect x="340" y="550" width="200" height="30" rx="6" fill="#211b33"/>
    <text x="440" y="570" text-anchor="middle">CER (lookup T-10 + proyección REM)</text>
    <rect x="140" y="586" width="190" height="30" rx="6" fill="#211b33"/>
    <text x="235" y="606" text-anchor="middle">Dollar Linked</text>
    <rect x="340" y="586" width="200" height="30" rx="6" fill="#211b33"/>
    <text x="440" y="606" text-anchor="middle">Duales (ruteo por pata)</text>
    <rect x="140" y="622" width="400" height="30" rx="6" fill="#211b33"/>
    <text x="340" y="642" text-anchor="middle">Hard Dollar — Soberanos / Provinciales / ONs (Local + NY)</text>
  </g>
  <text x="340" y="672" text-anchor="middle" fill="#8b95b3" font-size="11">TIR · Duration · Convexidad · Z-spread · vistas Mercado / Compra / Venta</text>

  <rect x="640" y="494" width="440" height="190" rx="10" fill="#131f22" stroke="#4299e1" stroke-width="1.5"/>
  <text x="860" y="520" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">Capa de Señales &amp; Análisis</text>
  <text x="860" y="537" text-anchor="middle" fill="#8b95b3" font-size="11">sin look-ahead bias · corrección por pruebas múltiples</text>
  <g font-size="12" fill="#cbd5f5">
    <rect x="660" y="550" width="190" height="30" rx="6" fill="#122733"/>
    <text x="755" y="570" text-anchor="middle">GSSI (estrés global)</text>
    <rect x="860" y="550" width="200" height="30" rx="6" fill="#122733"/>
    <text x="960" y="570" text-anchor="middle">Nowcasting recesión EE.UU.</text>
    <rect x="660" y="586" width="190" height="30" rx="6" fill="#122733"/>
    <text x="755" y="606" text-anchor="middle">Valor relativo · TIR histórica</text>
    <rect x="860" y="586" width="200" height="30" rx="6" fill="#122733"/>
    <text x="960" y="606" text-anchor="middle">Carry · forwards · roll-down</text>
    <rect x="660" y="622" width="400" height="30" rx="6" fill="#122733"/>
    <text x="860" y="642" text-anchor="middle">14 vistas macro Argentina (fiscal · bancos · reservas ...)</text>
  </g>
  <text x="860" y="672" text-anchor="middle" fill="#8b95b3" font-size="11">semáforos de riesgo · frescura de datos por serie</text>

  <line x1="340" y1="684" x2="500" y2="722" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="684" x2="700" y2="722" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5: Dashboard -->
  <rect x="160" y="728" width="880" height="128" rx="12" fill="#161d33" stroke="#ed8936" stroke-width="1.5"/>
  <text x="600" y="754" text-anchor="middle" fill="#fbb768" font-size="15" font-weight="700">05 · DASHBOARD (Streamlit + Plotly)</text>
  <g font-size="12.5" fill="#cbd5f5">
    <rect x="180" y="768" width="160" height="76" rx="8" fill="#241a10"/>
    <text x="260" y="794" text-anchor="middle" font-weight="600">Inicio</text>
    <text x="260" y="812" text-anchor="middle" font-size="10.5" fill="#9aa4c4">brief matutino</text>
    <text x="260" y="828" text-anchor="middle" font-size="10.5" fill="#9aa4c4">reloj y banderas</text>
    <rect x="350" y="768" width="160" height="76" rx="8" fill="#241a10"/>
    <text x="430" y="794" text-anchor="middle" font-weight="600">Renta Fija</text>
    <text x="430" y="812" text-anchor="middle" font-size="10.5" fill="#9aa4c4">16 pestañas</text>
    <text x="430" y="828" text-anchor="middle" font-size="10.5" fill="#9aa4c4">200+ instrumentos</text>
    <rect x="520" y="768" width="160" height="76" rx="8" fill="#241a10"/>
    <text x="600" y="794" text-anchor="middle" font-weight="600">Liquidez Global</text>
    <text x="600" y="812" text-anchor="middle" font-size="10.5" fill="#9aa4c4">Charting · niveles</text>
    <text x="600" y="828" text-anchor="middle" font-size="10.5" fill="#9aa4c4">GSSI · recesión US</text>
    <rect x="690" y="768" width="160" height="76" rx="8" fill="#241a10"/>
    <text x="770" y="794" text-anchor="middle" font-weight="600">Macro Argentina</text>
    <text x="770" y="812" text-anchor="middle" font-size="10.5" fill="#9aa4c4">14 vistas</text>
    <text x="770" y="828" text-anchor="middle" font-size="10.5" fill="#9aa4c4">fiscal · bancos · reservas</text>
    <rect x="860" y="768" width="160" height="76" rx="8" fill="#241a10"/>
    <text x="940" y="794" text-anchor="middle" font-weight="600">Mi cartera</text>
    <text x="940" y="812" text-anchor="middle" font-size="10.5" fill="#9aa4c4">tenencias · riesgo</text>
    <text x="940" y="828" text-anchor="middle" font-size="10.5" fill="#9aa4c4">calificaciones CNV</text>
  </g>

  <line x1="600" y1="856" x2="600" y2="894" stroke="#4a5578" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 6: Salidas -->
  <text x="60" y="918" fill="#8b95b3" font-size="13" font-weight="600" letter-spacing="1">06 · ENTREGABLES</text>
  <g font-size="12.5" fill="#cbd5f5">
    <rect x="60" y="930" width="340" height="40" rx="8" fill="#12261d" stroke="#2f6b4f"/>
    <text x="230" y="955" text-anchor="middle">Ficha Excel por instrumento · exportación masiva</text>
    <rect x="430" y="930" width="340" height="40" rx="8" fill="#12261d" stroke="#2f6b4f"/>
    <text x="600" y="955" text-anchor="middle">Research Report en PDF para clientes e inversores</text>
    <rect x="800" y="930" width="340" height="40" rx="8" fill="#12261d" stroke="#2f6b4f"/>
    <text x="970" y="955" text-anchor="middle">Alertas · señales · tesis de inversión</text>
  </g>

  <!-- Operación y calidad -->
  <rect x="60" y="996" width="530" height="66" rx="10" fill="#131a2e" stroke="#3a4570"/>
  <text x="325" y="1020" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">OPERACIÓN</text>
  <text x="325" y="1042" text-anchor="middle" fill="#9aa4c4" font-size="11.5">4 tareas programadas · respaldo verificado · panel de salud de datos · caché de lecturas</text>
  <rect x="610" y="996" width="530" height="66" rx="10" fill="#131a2e" stroke="#3a4570"/>
  <text x="875" y="1020" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">CALIDAD</text>
  <text x="875" y="1042" text-anchor="middle" fill="#9aa4c4" font-size="11.5">~2.000 tests · contraste con fuentes independientes · auditorías documentadas</text>

  <text x="600" y="1096" text-anchor="middle" fill="#5b6488" font-size="11.5">Dos repos privados — motor de datos + motor de análisis — comparten un mismo warehouse. Este repo documenta el resultado.</text>
</svg>
